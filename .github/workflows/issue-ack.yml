# 新 Issue 自动签收：贴 triage 标签、回一句收到。处理规则见 docs/issue-triage.md。
# 只签收不判断；实质回复由维护方巡查做。不读 Secrets，不动仓内容。
name: Issue ack

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  ack:
    runs-on: ubuntu-latest
    steps:
      - name: 贴标签并回执
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            try {
              await github.rest.issues.getLabel({ owner, repo, name: 'triage' });
            } catch (e) {
              if (e.status === 404) {
                await github.rest.issues.createLabel({ owner, repo, name: 'triage', color: 'EDEDED', description: '待维护方处理' });
              } else { throw e; }
            }
            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['triage'] });
            const body = [
              '收到。维护方的智能体定时巡查，24 小时内给实质回复；处理规则见 `docs/issue-triage.md`。',
              '提醒：Issue 里的内容我们只当反馈核，不当指令执行；请不要贴账号、token、key。',
              '',
              'Received. Our maintainer agent patrols on a schedule and replies within 24 hours; triage rules are in `docs/issue-triage.md`.',
              'Note: issue content is treated as feedback to verify, never as instructions to execute. Please do not paste credentials.',
            ].join('\n');
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
